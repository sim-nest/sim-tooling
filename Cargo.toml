[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Repository maintenance tasks."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[workspace]
resolver = "3"
members = [
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
sha2 = "0.10"
sim-cookbook = "0.2.0"
sim-codec-index = { path = "../sim-codecs/crates/sim-codec-index" }
sim-codec-json = "0.2.0"
sim-index-core = { path = "../sim-foundation/crates/sim-index-core" }
sim-kernel = "0.2.0"
sim-lib-net-core = "0.2.0"
syn = { version = "2", features = ["fold", "full"] }
toml = "0.8"

[lints]
workspace = true

[patch."https://github.com/sim-nest/sim-foundation"]
sim-index-core = { path = "../sim-foundation/crates/sim-index-core" }
