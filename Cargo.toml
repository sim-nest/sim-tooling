[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Repository maintenance tasks."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[workspace]
resolver = "3"
members = [
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
sha2 = "0.10"
sim-cookbook = "0.2.0"
sim-codec-index = { version = "0.2.0", git = "https://github.com/sim-nest/sim-codecs", rev = "89320a0f0158e3399b08c8cf97df194912969233" }
sim-codec-json = "0.2.0"
sim-index-core = { version = "0.1.0", git = "https://github.com/sim-nest/sim-foundation", rev = "545515c9fcbf17d1ed982756788b3f4c2363da3b" }
sim-kernel = "0.2.0"
sim-lib-net-core = "0.2.0"
syn = { version = "2", features = ["full"] }
toml = "0.8"

[lints]
workspace = true
