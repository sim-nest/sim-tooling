[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Repository maintenance tasks."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[package.metadata.sim.release-version-bindings]
sim-citizen = "0.4.0"
sim-citizen-derive = "0.4.0"
sim-kernel = "0.4.0"

[workspace]
resolver = "3"
members = []
exclude = [
    "crates/sim-check-pack",
    "crates/sim-check-pack-ubuntu-pc",
    "crates/sim-check-pack-xtask",
]

# Every Cargo manifest in this repository belongs to its generated contract.
# The check-pack crates (crates/) and the simdoc contract engine
# (crates/simdoc) keep their own resolver roots; declaring them here makes
# their packages part of the one repo contract.
[workspace.metadata.sim]
contract-workspaces = ["crates", "crates/simdoc"]
# Recorded verbatim in docs/generated/provenance.json: the command that
# regenerates this repository's documentation and the gate that validates it
# (the same commands .github/workflows/ci.yml runs).
docs-command = "cargo run --locked --offline --manifest-path crates/simdoc/Cargo.toml -- simdoc"
validation-commands = [
    "cargo fmt --all --check",
    "cargo test",
    "cargo clippy --all-targets -- -D warnings",
    "cargo doc --no-deps",
    "cargo fmt --manifest-path crates/simdoc/Cargo.toml --check",
    "cargo test --locked --manifest-path crates/simdoc/Cargo.toml",
    "cargo clippy --locked --manifest-path crates/simdoc/Cargo.toml --all-targets -- -D warnings",
    "cargo run --locked --manifest-path crates/simdoc/Cargo.toml -- simdoc --check",
    "cargo run -p xtask -- check-file-sizes",
    "cargo run -p xtask -- repo-contract --check --repo .",
    "cargo run -p xtask -- validation-matrix --check --repo .",
    "cargo run -p xtask -- crate-catalog --check --repo .",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-tooling"
homepage = "https://github.com/sim-nest/sim-tooling"

[workspace.lints.rust]
unsafe_code = "deny"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sim-cookbook = "0.4.0"
sim-codec-index = "0.3.0"
sim-codec-index-vault = "0.2.0"
sim-codec-json = "0.4.0"
sim-index-core = "0.4.0"
sim-index-vault-core = "0.2.0"
sim-kernel = "0.4.0"
sim-lib-net-core = "0.4.0"
sim-lib-numbers-stats = "0.6.0"
sim-table-core = "0.3.0"
syn = { version = "2", features = ["fold", "full", "visit"] }
toml = "0.8"

[lints]
workspace = true

[workspace.metadata.sim.encoder]
source_sha256 = "f41198c08ada115be277d5b936236671b8fd15380d52c5b74f853457f74d6a54"
lock_sha256 = "de3cf584352514646909797b8454326e8ba4d3d90bf87ed7c3592ae971073678"
toolchain = "1.96.0"
