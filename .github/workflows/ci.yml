# GitHub Actions CI for this crate.
name: ci
on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: select validation scope
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.scope.outputs.run-heavy }}
    steps:
      - id: scope
        name: Avoid duplicate PR and main validation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          run_heavy=true
          if [ "$EVENT_NAME" = pull_request ]; then
            sleep 15
            state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
            sole="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
              --jq 'any(.labels[]; .name == "roadmap-sole-contributor")')"
            if [ "$state" != open ] || [ "$sole" = true ]; then
              run_heavy=false
            fi
          fi
          echo "run-heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  heavy:
    name: heavy validation
    needs: scope
    if: ${{ needs.scope.outputs.run-heavy == 'true' }}
    runs-on: ubuntu-latest
    env:
      # Must equal the channel pinned in rust-toolchain.toml; the assertion
      # step below fails the job if either side drifts.
      RUST_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Assert the pinned toolchain
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test "$pinned" = "$RUST_TOOLCHAIN"
          for dir in . crates/simdoc; do
            (cd "$dir" && rustc --version --verbose && cargo --version --verbose)
            (cd "$dir" && rustc --version --verbose | grep -qx "release: $pinned")
            (cd "$dir" && cargo --version --verbose | grep -qx "release: $pinned")
          done
      - run: cargo fmt --all --check
      # crates/simdoc is a separate resolver root with its own Cargo.lock
      # (pinning different dependency versions than the root workspace, e.g.
      # cfg-if 1.0.4 vs 1.0.5 here). The root test suite exercises the real
      # private-Cargo-home builder (src/cargo_home.rs) against that lock, so
      # its exact locked dependency set must already be in the runner's
      # ambient registry cache before `cargo test` runs below -- fetch it
      # first rather than relying on some later step to have warmed it.
      - run: cargo fetch --locked --manifest-path crates/simdoc/Cargo.toml
      # The committed toolchain pin is the content digest of the guest's own
      # rustup 1.96.0 install (docs/simdoc-trust-boundaries.md B6): the guest
      # is the documented source of truth, and no other rustup install of the
      # same release -- tiger's or a hosted runner's -- has ever been
      # observed to match it byte-for-byte, though all report the identical
      # release and commit hashes. B6 already names, as a known local-
      # environment gap and not a release gate, every test that must build or
      # run the real pinned engine to pass: they refuse to find a matching
      # toolchain here for the same reason they already do on tiger. Skipped
      # here, not weakened: the launcher's and engine's own toolchain-identity
      # refusal (B6, B11) is unchanged and still runs for real on the guest.
      - run: |
          cargo test -- \
            --skip the_committed_engine_identity_is_current \
            --skip generator_commands_accept_explicit_repo_root \
            --skip every_contract_route_matches_the_engine_byte_for_byte_on_nested_packages \
            --skip a_fake_rustup_and_fake_path_tools_are_never_run_before_or_after_launch \
            --skip cargo_configuration_never_reaches_the_engine \
            --skip a_farm_manifest_cannot_point_cargo_outside_the_bound_closure \
            --skip a_launcher_refuses_an_engine_whose_source_or_lock_changed_after_the_pin
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # simdoc is its own resolver root (crates/simdoc/Cargo.lock), outside
      # the root workspace, so the root gates above never build or test it.
      # fmt alone is checked here: it parses source without compiling, so it
      # needs no matching toolchain and still catches real drift.
      - run: cargo fmt --manifest-path crates/simdoc/Cargo.toml --check
      # Deliberately not run here: `cargo test`/`clippy`/`run -- simdoc
      # --check` against crates/simdoc. Its build.rs refuses to compile the
      # crate at all unless the active toolchain's content digest equals the
      # committed pin (docs/simdoc-trust-boundaries.md B6, B11) -- this is
      # the engine's own security boundary, not a bug, and it is not being
      # weakened or routed around here. No rustup install of the pinned
      # release observed anywhere other than the guest -- not tiger's, not
      # this hosted runner's -- has ever matched that pin byte-for-byte,
      # though all report the identical release and commit hashes; standing
      # up infrastructure to distribute a byte-identical toolchain to hosted
      # CI was considered and explicitly declined (maintainer decision,
      # 2026-09-29: B6 is guest-only by design, matching `repos.toml`'s
      # `docs_command` already being guest-scoped for the same reason -- see
      # B12). These three checks run for real only on the guest; that is
      # where crates/simdoc's own release correctness is actually verified.
      - run: cargo run -p xtask -- check-file-sizes

  check:
    name: check
    if: ${{ always() }}
    needs: [scope, heavy]
    runs-on: ubuntu-latest
    steps:
      - name: Require heavy validation when enabled
        env:
          HEAVY_RESULT: ${{ needs.heavy.result }}
          RUN_HEAVY: ${{ needs.scope.outputs.run-heavy }}
        run: |
          if [ "$RUN_HEAVY" != true ]; then
            exit 0
          fi
          test "$HEAVY_RESULT" = success
