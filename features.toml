schema = "sim.features"

[enforcement.audience]
user = "strict"
framework = "strict"
code = "strict"

[enforcement.surface]
cli = "strict"
docs = "advisory"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-tooling/generated-docs"
title = "Generated documentation lanes"
summary = "Generate repo contracts, feature maps, card indexes, index fragments and claim certificates, and managed vault note namespaces through xtask; selected repo-contract artifacts can also be emitted without mutating source."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use this row when adding a generated doc lane, checking generated index artifacts, synchronizing a managed generated namespace, or adapting a preopened repository observation by emitting selected current repo-contract artifacts into a preopened output directory without updating docs/generated."
claims_anchors = [
  "anchor/crate/xtask",
  "anchor/doc/generated/card-index",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/repo-contract",
  "anchor/doc/generated/sim-index-fragment",
  "anchor/export/xtask/browse/catalog",
  "anchor/export/xtask/codec-lisp",
  "anchor/export/xtask/codec/json",
  "anchor/export/xtask/codec/lisp",
  "anchor/export/xtask/doc/chunk-recursive",
  "anchor/export/xtask/registry/catalog",
]
claims_specimens = [
  "spec-test/sim-tooling/src/repo_contract_tests",
  "spec-test/sim-tooling/src/index_render_tests",
]

[[feature]]
id = "feature/sim-tooling/conformance-pack-invocation"
title = "Exact conformance-pack invocation"
summary = "Invoke one statically bound public conformance pack over a bounded canonical evidence projection, recompute its checked-subject identity, and emit one verified typed invocation and receipt."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use check-pack only with the runtime CheckerBindingId derived from the immutable activation record and one allowed CheckScopeId. Supply sorted key=value evidence on standard input and preserve the emitted activation source, binding, subject, scope, execution, invocation, result, grade, receipt, revocation state, and observations; refusal and UnimplementedPack outcomes never satisfy a phase gate."
claims_specimens = ["spec-test/sim-tooling/src/check_pack"]
supports = [
  "feature/sim-foundation/conformance-core",
  "feature/sim-sdk/neutral-conformance-packs",
]

[[feature]]
id = "feature/sim-index/core"
title = "SIM Index core"
summary = "Generate, query, route, prove, and check duplicate implementation overlap, benchmark ownership, and source-backed authored composition claims in the SIM Index graph as a checked constellation surface."
owner = "crate/xtask"
audiences = ["user", "code", "framework"]
guidance = "Use this row when checking whether a feature exists, tracing routes, finding reuse owners, preventing duplicate implementation code, enforcing the single benchmark runner and statistics owners, reviewing source, normalized record-shape, conservative protocol implementation-shape overlap, authored protocol-role coverage, and authored reuses or composes relations on one board, or proving the generated index is current. Benchmark workloads remain definitions; runner or summary implementations belong to sim-tooling or sim-lib-numbers-stats unless a checked reuse, composition, or delegation path names that owner. Implementation candidates require the same resolved protocol and alpha-normalized body shape; protocol-role questions additionally require an authored role plus a graph dependency path to its trait owner, so policy records, prototypes, predicates, and metatables are not inferred from nominal similarity. Reuse and composition claims resolve to owner packages and require both a normal dependency and a reachable production call, impl, or type-use fact unless an explicit checked delegation edge records the indirection."
claims_anchors = [
  "anchor/cli/xtask",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-tooling/generated",
]
claims_specimens = [
  "spec-test/sim-tooling/src/index_fixpoint_tests",
]

[[feature]]
id = "feature/sim-index/vault-export"
title = "SIM Index vault export"
summary = "Load the public SIM Index, delegate complete vault projection and Markdown bundle encoding to their public owners, and materialize the resulting artifacts in one managed namespace."
owner = "crate/xtask"
audiences = ["user", "code", "framework"]
guidance = "Use this row only for filesystem-facing command behavior: canonical Index loading, artifact planning and reports, one managed materialization transaction, v1-to-v2 migration, verify without writing, and ownership/byte checks before semantic verification. Projection belongs to sim-index-vault-core and profile selection, bundle encoding, decoding, and semantic verification belong to sim-codec-index-vault; tooling must not enumerate IndexDoc fields or regain profile and Markdown rendering tables."
claims_anchors = [
  "anchor/export/xtask/codec/index-vault",
]
claims_specimens = [
  "spec-test/sim-tooling/src/index_vault_tests",
  "spec-test/sim-tooling/src/index_vault_write_tests",
]
supports = [
  "feature/sim-index/core",
  "feature/sim-foundation/index-vault-projection",
  "feature/sim-codecs/index-vault-codec",
  "feature/sim-tooling/generated-docs",
]

[[feature]]
id = "feature/sim-tooling/benchmark-environment-compatibility"
title = "Benchmark environment compatibility"
summary = "Probe typed host and build evidence and refuse benchmark comparisons when policy-required material fields are unavailable or differ."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use the inventory-backed DeclaredHost identity with probe_environment, then apply a CompatibilityPolicy before comparing benchmark results. Treat unavailable evidence as a refusal; never substitute a hostname label or guessed host property."
claims_anchors = [
  "anchor/rustdoc/xtask/bench/env/compatibility_mismatches",
  "anchor/rustdoc/xtask/bench/env/declared-host",
  "anchor/rustdoc/xtask/bench/env/environment-probe",
  "anchor/rustdoc/xtask/bench/env/probe_environment",
]
claims_specimens = [
  "spec-test/sim-tooling/src/bench/env",
]

[[feature]]
id = "feature/sim-tooling/benchmark-sampling"
title = "Deterministic benchmark sampling"
summary = "Run setup, calibration, warmup, and measured benchmark phases through an injectable monotonic clock while retaining calibration choices, realized interleaving, raw counters, timeouts, and failures."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Implement Workload and MonotonicClock adapters, validate RunConfig, and retain the complete RunRecord. Summarize only its successful measured observations; calibration and warmup are execution evidence, not statistical samples."
claims_anchors = [
  "anchor/rustdoc/xtask/bench/run/calibration-decision",
  "anchor/rustdoc/xtask/bench/run/monotonic-clock",
  "anchor/rustdoc/xtask/bench/run/run-config",
  "anchor/rustdoc/xtask/bench/run/run-phase",
  "anchor/rustdoc/xtask/bench/run/run-record",
  "anchor/rustdoc/xtask/bench/run/sample-record",
  "anchor/rustdoc/xtask/bench/run/sample-status",
  "anchor/rustdoc/xtask/bench/run/workload",
]
claims_specimens = [
  "spec-test/sim-tooling/src/bench/run",
]

[[feature]]
id = "feature/sim-tooling/benchmark-process-isolation"
title = "Portable bounded benchmark execution"
summary = "Execute benchmark workloads as exact argument vectors with portable child termination, reaping, output, and time bounds, explicit status, and honest refusal of host-specific affinity or process-tree claims."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use ProcessDeclaration and execute for portable process-backed workloads. The executor directly spawns and bounds one child without shell interpolation or OS/HW selection. Affinity and complete process-tree containment require externally supplied platform-capsule evidence and are never guessed or obtained through a platform-specific fallback in this host tool. Adapters may prepare files and return a declaration through WorkloadAdapter, but the executor alone constructs the immutable ProcessSample."
claims_anchors = [
  "anchor/rustdoc/xtask/bench/exec/cpu-affinity",
  "anchor/rustdoc/xtask/bench/exec/execute",
  "anchor/rustdoc/xtask/bench/exec/execute_adapter",
  "anchor/rustdoc/xtask/bench/exec/isolation-record",
  "anchor/rustdoc/xtask/bench/exec/process-declaration",
  "anchor/rustdoc/xtask/bench/exec/process-sample",
  "anchor/rustdoc/xtask/bench/exec/workload-adapter",
]
claims_specimens = [
  "spec-test/sim-tooling/src/bench/exec",
]
composes = [
  "feature/sim-tooling/benchmark-sampling",
]

[[feature]]
id = "feature/sim-tooling/host-tool-boundary"
title = "Portable host-tool boundary"
summary = "Classify sim-tooling as a structurally isolated host tool, render host-tool facts separately from platform-capsule facts, and reject host-tool reachability from product targets."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use platform-inventory and simctl platform check for the one semantic host-fact graph. Host tools may use portable checkout, filesystem, environment, and direct-process constructions, but must not select an OS, hardware target, capsule, or platform-specific fallback, and no product target may depend on them."
claims_anchors = [
  "anchor/bin/xtask",
]
claims_specimens = [
  "spec-test/sim-tooling/src/platform_inventory_tests",
]
supports = [
  "feature/sim-index/core",
]

[[feature]]
id = "feature/sim-tooling/robust-benchmark-comparison"
title = "Robust benchmark comparison"
summary = "Apply declared sample, MAD outlier, dispersion, environment, and threshold policy while delegating summaries and deterministic uncertainty intervals to the statistics owner."
owner = "crate/xtask"
audiences = ["code", "framework"]
guidance = "Use compare with raw indexed samples, typed environment probes, and an explicit RobustComparisonPolicy. Inspect exclusions and inconclusive reasons before consuming the outcome; incompatible or high-dispersion evidence never becomes a threshold pass."
claims_anchors = [
  "anchor/rustdoc/xtask/bench/compare/compare",
  "anchor/rustdoc/xtask/bench/compare/comparison-report",
  "anchor/rustdoc/xtask/bench/compare/excluded-sample",
  "anchor/rustdoc/xtask/bench/compare/robust-comparison-policy",
  "anchor/rustdoc/xtask/bench/compare/robust-summary",
]
claims_specimens = [
  "spec-test/sim-tooling/src/bench/compare",
]
composes = [
  "feature/sim-tooling/benchmark-environment-compatibility",
  "feature/sim-tooling/benchmark-sampling",
]

[[feature]]
id = "feature/sim-tooling/benchmark-cli"
title = "Benchmark artifact CLI"
summary = "Run distinct immutable process benchmark arms and compare, inspect, or policy-check durable reports whose identities, raw durations, and workload counters are derived from one verified report object."
owner = "crate/xtask"
audiences = ["user", "code", "framework"]
guidance = "Use bench run with a declared JSON request to create an atomic artifact; baseline and candidate must name distinct executable-content, build, command, and exact process identities before dispatch. BENCH overrides SIM_BENCH_ITERATIONS for calibration, warmup, and measurement, and workload stdout must echo that count as executed_iterations beside an exact JSON counter object whose remaining counters are declared by the BenchSpec. The report preserves both arm identities and every calibration, warmup, and measured attempt while deriving statistics only from completed measured rows; a run without any valid measured sample writes its attempt ledger and fails. Use bench compare or bench show to inspect it, and bench check for read-only policy enforcement. Select --json when automation needs the same ReportView fields shown concisely to humans. Reuse jvm_baseline::corpus for the BYTECODE_SPEED_4 cold-preparation and warm-execution workload declarations, and jvm_acceptance for its baseline-derived frozen acceptance policy."
claims_anchors = [
  "anchor/rustdoc/xtask/bench/cli/command-spec",
  "anchor/rustdoc/xtask/bench/report/counter-sample",
  "anchor/rustdoc/xtask/bench/cli/report-view",
  "anchor/rustdoc/xtask/bench/cli/run-request",
]
claims_specimens = [
  "spec-test/sim-tooling/src/bench/neutral_allocation_conformance",
  "spec-test/sim-tooling/src/bench/neutral_cpu_conformance",
]
composes = [
  "feature/sim-tooling/benchmark-process-isolation",
  "feature/sim-tooling/robust-benchmark-comparison",
]

[[route]]
id = "route/prove-benchmark-workload-neutrality"
task = "Prove the benchmark harness is workload neutral"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-tooling/benchmark-cli", why = "The benchmark CLI composes sampling, process isolation, robust comparison, and durable reports without a domain-specific workload contract." },
  { specimen = "spec-test/sim-tooling/src/bench/neutral_cpu_conformance", why = "The checked CPU-bound specimen proves deterministic sampling, matched comparison, host refusal, retained failure, and Table/Dir browsing without bytecode." },
  { specimen = "spec-test/sim-tooling/src/bench/neutral_allocation_conformance", why = "The checked allocation-bound specimen proves local fingerprinting, high-dispersion refusal, retained failure, and durable report browsing without bytecode." },
]

[[route]]
id = "route/add-generated-doc"
task = "Add a generated doc"
audiences = ["code", "framework"]
steps = [
  { feature = "feature/sim-tooling/generated-docs", why = "The xtask documentation row owns generated doc lanes and index fragments." },
]

[[route]]
id = "route/find-whether-feature-exists"
task = "Find whether a feature exists or reuse existing code"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-index/core", why = "The SIM Index core row owns generated graph queries, strict fixpoint checks, overlap checks, and duplicate implementation prevention." },
  { specimen = "spec-test/sim-tooling/src/index_fixpoint_tests", why = "The checked fixpoint test proves the index can index and validate itself." },
]

[[route]]
id = "route/export-index-to-vault"
task = "Export the SIM Index to a Markdown vault"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-index/core", why = "The SIM Index core row owns the public graph that the vault exporter consumes." },
  { feature = "feature/sim-foundation/index-vault-projection", why = "The projection row consumes the canonical inventory and proves every row has exactly one primary claim." },
  { feature = "feature/sim-codecs/index-vault-codec", why = "The codec row owns document dialect composition, v2 bundles, v1 reading, and semantic verification." },
  { feature = "feature/sim-index/vault-export", why = "The vault export row owns canonical loading, artifacts, reports, migration, and managed command behavior." },
  { specimen = "spec-test/sim-codecs/crates/sim-codec-index-vault/tests/conformance", why = "The codec specimen proves all-profile round trips, semantic corruption rejection, and bounded v1 migration." },
  { specimen = "spec-test/sim-tooling/src/index_vault_write_tests", why = "The checked materialization specimen proves managed writes preserve sibling notes and application configuration." },
]
